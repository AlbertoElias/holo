name: Deploy

# Deploys production whenever CI passes on main, but only the apps changed
# since the last successful deploy (docs- or tooling-only merges deploy
# nothing; see scripts/ci-changed-areas.sh). Manual runs from the Actions tab
# (workflow_dispatch) redeploy or roll back the chosen targets (default all).
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      targets:
        description: Apps to deploy
        type: choice
        default: all
        options: [all, api, web, capture]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.29.3

jobs:
  changes:
    name: Select deploy targets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      api: ${{ steps.areas.outputs.api }}
      web: ${{ steps.areas.outputs.web }}
      capture_app: ${{ steps.areas.outputs.capture_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select areas
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets }}
        # Diff from the last successful CI-triggered deploy so merge commits,
        # multi-commit pushes and pushes whose CI was cancelled or failed are
        # all covered; manual (possibly partial) redeploys never count. With
        # no usable previous deploy, the empty base deploys everything.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="dispatch: ${TARGETS:-all}"
            case "${TARGETS:-all}" in
              all) echo "api=true"; echo "web=true"; echo "capture_app=true" ;;
              api) echo "api=true"; echo "web=false"; echo "capture_app=false" ;;
              web) echo "api=false"; echo "web=true"; echo "capture_app=false" ;;
              capture) echo "api=false"; echo "web=false"; echo "capture_app=true" ;;
              *) echo "Unknown targets '${TARGETS}'" >&2; exit 1 ;;
            esac >> "${GITHUB_OUTPUT}"
          else
            base="$(scripts/ci-push-base.sh deploy.yml HEAD "" workflow_run)"
            scripts/ci-changed-areas.sh "${base}" HEAD >> "${GITHUB_OUTPUT}"
          fi
          {
            echo "## Deploy targets (base: ${base:-none})"
            cat "${GITHUB_OUTPUT}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-api:
    name: Deploy API (Fly)
    needs: [changes]
    if: >-
      needs.changes.outputs.api == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy
        run: flyctl deploy -c fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://holoim-api.fly.dev/healthz; then exit 0; fi
            sleep 10
          done
          echo "API health check failed" >&2
          exit 1

  deploy-web:
    name: Deploy viewer (Pages)
    needs: [changes]
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build viewer
        # The `...` suffix also builds workspace dependencies (contracts)
        # whose dist entry the viewer bundle resolves.
        run: pnpm --filter @holoim/web... run build
        env:
          VITE_API_ORIGIN: https://holoim-api.fly.dev
      - name: Deploy to Pages
        run: pnpm --filter @holoim/web exec wrangler pages deploy dist --project-name holoim-viewer --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: curl -fsS -o /dev/null https://holoim-viewer.pages.dev/

  deploy-capture:
    name: Deploy capture (Pages)
    needs: [changes]
    if: >-
      needs.changes.outputs.capture_app == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build capture
        run: pnpm --filter @holoim/capture run build
      - name: Deploy to Pages
        run: pnpm --filter @holoim/web exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/capture/dist" --project-name holoim-capture --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: curl -fsS -o /dev/null https://holoim-capture.pages.dev/
