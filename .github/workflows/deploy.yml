name: Deploy

# Deploys production whenever CI passes on main, but only the apps the
# merged push touched (docs-only merges deploy nothing; see
# scripts/ci-changed-areas.sh). Manual runs are allowed from the Actions
# tab (workflow_dispatch) for redeploys and rollbacks, and deploy all apps.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.29.3

jobs:
  changes:
    name: Select deploy targets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      api: ${{ steps.areas.outputs.api }}
      web: ${{ steps.areas.outputs.web }}
      capture_app: ${{ steps.areas.outputs.capture_app }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Select areas
        id: areas
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/ci-changed-areas.sh >> "${GITHUB_OUTPUT}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
            scripts/ci-changed-areas.sh "${base}" HEAD >> "${GITHUB_OUTPUT}"
          fi

  deploy-api:
    name: Deploy API (Fly)
    needs: [changes]
    if: >-
      needs.changes.outputs.api == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy
        run: flyctl deploy -c fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://holoim-api.fly.dev/healthz; then exit 0; fi
            sleep 10
          done
          echo "API health check failed" >&2
          exit 1

  deploy-web:
    name: Deploy viewer (Pages)
    needs: [changes]
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build viewer
        # The `...` suffix also builds workspace dependencies (contracts)
        # whose dist entry the viewer bundle resolves.
        run: pnpm --filter @holoim/web... run build
        env:
          VITE_API_ORIGIN: https://holoim-api.fly.dev
      - name: Deploy to Pages
        run: pnpm --filter @holoim/web exec wrangler pages deploy dist --project-name holoim-viewer --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: curl -fsS -o /dev/null https://holoim-viewer.pages.dev/

  deploy-capture:
    name: Deploy capture (Pages)
    needs: [changes]
    if: >-
      needs.changes.outputs.capture_app == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build capture
        run: pnpm --filter @holoim/capture run build
      - name: Deploy to Pages
        run: pnpm --filter @holoim/web exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/capture/dist" --project-name holoim-capture --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: curl -fsS -o /dev/null https://holoim-capture.pages.dev/
