name: Deploy

# Manual redeploy or rollback of the chosen targets (default all) from the
# Actions tab. Pushes to main deploy from ci.yml as soon as each app's suites
# pass (docs/features/ci-under-5m.md); this workflow builds from source and
# shares ci.yml's per-app deploy groups, so the two never deploy one app at
# the same time.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Apps to deploy
        type: choice
        default: all
        options: [all, api, web, capture]

permissions:
  contents: read

env:
  PNPM_VERSION: 10.29.3

jobs:
  changes:
    name: Select deploy targets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      api: ${{ steps.areas.outputs.api }}
      web: ${{ steps.areas.outputs.web }}
      capture_app: ${{ steps.areas.outputs.capture_app }}
    steps:
      - name: Select areas
        id: areas
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          case "${TARGETS:-all}" in
            all) echo "api=true"; echo "web=true"; echo "capture_app=true" ;;
            api) echo "api=true"; echo "web=false"; echo "capture_app=false" ;;
            web) echo "api=false"; echo "web=true"; echo "capture_app=false" ;;
            capture) echo "api=false"; echo "web=false"; echo "capture_app=true" ;;
            *) echo "Unknown targets '${TARGETS}'" >&2; exit 1 ;;
          esac >> "${GITHUB_OUTPUT}"
          {
            echo "## Deploy targets (dispatch: ${TARGETS:-all})"
            cat "${GITHUB_OUTPUT}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-api:
    name: Deploy API (Fly)
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: Deploy
        run: flyctl deploy -c fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://holoim-api.fly.dev/healthz; then exit 0; fi
            sleep 10
          done
          echo "API health check failed" >&2
          exit 1

  deploy-web:
    name: Deploy viewer (Pages)
    needs: [changes, deploy-api]
    # Deploying both: the viewer waits for the API to be live.
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' &&
      (needs.changes.outputs.api != 'true' || needs.deploy-api.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build viewer
        # The `...` suffix also builds workspace dependencies (contracts)
        # whose dist entry the viewer bundle resolves.
        run: pnpm --filter @holoim/web... run build
        env:
          VITE_API_ORIGIN: https://holoim-api.fly.dev
      - name: Deploy to Pages
        run: pnpm --filter @holoim/web exec wrangler pages deploy dist --project-name holoim-viewer --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: curl -fsS -o /dev/null https://holoim-viewer.pages.dev/

  deploy-capture:
    name: Deploy capture (Pages)
    needs: [changes]
    if: needs.changes.outputs.capture_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production-capture
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build capture
        # Like the viewer: `...` builds the workspace packages (meaning) whose
        # dist entry the production bundle resolves.
        run: pnpm --filter @holoim/capture... run build
        env:
          # Object search (Find an object) calls the API's public /api/objects routes.
          VITE_API_ORIGIN: https://holoim-api.fly.dev
      - name: Deploy to Pages
        # Wrangler (installed with the viewer) runs from apps/capture: pages
        # deploy bundles the functions/ directory and reads the wrangler.toml
        # of the directory it runs in, so running it from apps/viewer-web
        # shipped the viewer's feed function onto capture, which preloaded a
        # hologram that media CORS allows only for the viewer.
        working-directory: apps/capture
        run: ../viewer-web/node_modules/.bin/wrangler pages deploy dist --project-name holoim-capture --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        # Also fails if a viewer Pages Function is serving capture again.
        run: |
          html="$(curl -fsS https://holoim-capture.pages.dev/)"
          if grep -q '__HOLOIM_FEED__' <<<"${html}"; then
            echo "capture is serving the viewer's feed function" >&2
            exit 1
          fi
