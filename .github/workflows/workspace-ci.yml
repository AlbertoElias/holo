name: Workspace CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_heavy_xr:
        description: Run nightly/manual heavy XR coverage
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 9 * * *"

jobs:
  pr-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install KTX-Software
        env:
          KTX_VERSION: 4.4.2
        run: |
          curl -fsSL -o /tmp/ktx.tar.bz2 "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}/KTX-Software-${KTX_VERSION}-Linux-x86_64.tar.bz2"
          tar -xjf /tmp/ktx.tar.bz2 -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/KTX-Software-${KTX_VERSION}-Linux-x86_64/bin" >> "${GITHUB_PATH}"
          ktx --version

      - name: Verify workspace
        run: pnpm run verify:full

  xr-nightly:
    if: github.event_name == 'schedule' || github.event.inputs.run_heavy_xr == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install KTX-Software
        env:
          KTX_VERSION: 4.4.2
        run: |
          curl -fsSL -o /tmp/ktx.tar.bz2 "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}/KTX-Software-${KTX_VERSION}-Linux-x86_64.tar.bz2"
          tar -xjf /tmp/ktx.tar.bz2 -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/KTX-Software-${KTX_VERSION}-Linux-x86_64/bin" >> "${GITHUB_PATH}"
          ktx --version

      - name: Verify workspace baseline
        run: pnpm run verify:full

      - name: Capture XR locomotion flows
        run: pnpm --filter @holoim/capture run test:xr:flows

      - name: Viewer live API integration
        run: RUN_E2E_INTEGRATION=1 pnpm --filter @holoim/web run test:e2e:integration
