name: CI

# Local-first verification: agents run `pnpm run verify:agent` in the loop
# and `pnpm run verify:pr` before merging (see AGENT_CONTRACT.md). Hosted CI
# therefore runs only on pushes to main and on manual dispatch — never on
# branches or pull requests. On main, a changes job selects only the suites
# relevant to the files the push touched (docs-only pushes run no suites);
# manual dispatch always runs the full suite.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.29.3

jobs:
  changes:
    name: Select jobs for changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    outputs:
      quality: ${{ steps.areas.outputs.quality }}
      capture_xr: ${{ steps.areas.outputs.capture_xr }}
      e2e: ${{ steps.areas.outputs.e2e }}
      pipeline: ${{ steps.areas.outputs.pipeline }}
      portal: ${{ steps.areas.outputs.portal }}
      docs_only: ${{ steps.areas.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select areas
        id: areas
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        # Diff from the last successful CI run on main, so pushes whose run
        # was cancelled by this one or failed are re-checked; the push's
        # `before` is the fallback.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scripts/ci-changed-areas.sh >> "${GITHUB_OUTPUT}"
          else
            base="$(scripts/ci-push-base.sh ci.yml "${GITHUB_SHA}" "${BEFORE}")"
            scripts/ci-changed-areas.sh "${base}" "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
          {
            echo "## Changed areas"
            cat "${GITHUB_OUTPUT}"
          } >> "${GITHUB_STEP_SUMMARY}"


  # Lint, unit tests and the production build share one runner: each is
  # under a minute, and Actions bills every job rounded up to the minute.
  quality:
    name: Quality, unit tests and build
    needs: [changes]
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Lint and typecheck
        run: pnpm timed quality-checks -- pnpm run check:all
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: pnpm timed unit-tests -- pnpm run test:unit:all
      - name: Cache KTX-Software
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: /tmp/ktx.tar.bz2
          key: ktx-4.4.2-linux-x86_64
      - name: Install KTX-Software
        if: ${{ !cancelled() }}
        env:
          KTX_VERSION: 4.4.2
        run: |
          if [ ! -f /tmp/ktx.tar.bz2 ]; then curl -fsSL -o /tmp/ktx.tar.bz2 "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}/KTX-Software-${KTX_VERSION}-Linux-x86_64.tar.bz2"; fi
          tar -xjf /tmp/ktx.tar.bz2 -C "${RUNNER_TEMP}"
          KTX_ROOT="$(find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'KTX-Software-*' | head -n 1)"
          test -n "${KTX_ROOT}"
          echo "${KTX_ROOT}/bin" >> "${GITHUB_PATH}"
          "${KTX_ROOT}/bin/ktx" --version
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm timed build -- pnpm run build:all
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timings-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Browser end-to-end checks run as parallel jobs (2 capture XR shards,
  # viewer and Knowledge Atlas, 2 capture → viewer pipeline shards, portal)
  # so CI wall time follows the slowest suite rather than their sum. Shard
  # counts balance wall time against billed minutes (per job, rounded up).
  capture-xr:
    name: Capture XR checks (shard ${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.capture_xr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Each runner runs its slice serially: two checks at once on one 2-vCPU
    # runner pushed cold page loads past the 30 s goto limit (20b1986e40ae).
    # The public runner has 4 vCPUs, which would default to 2 at a time, so
    # the concurrency is pinned. run-xr-checks.ts balances the slices by cost
    # and covers every check.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      XR_SHARD: ${{ matrix.shard }}/2
      XR_CHECK_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          playwright: "true"
      - name: Capture XR checks
        run: pnpm timed xr-capture-shard-${{ matrix.shard }} -- pnpm run test:xr:capture
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capture-xr-failure-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            apps/capture/output/xr-checks
            apps/capture/output/ci-mock-vr
            apps/capture/output/ci-vr-locomotion
            apps/capture/output/ci-hand-replay
            apps/capture/output/ci-body-replay/*-report.json
            apps/capture/output/ci-terrain-locomotion
            apps/capture/output/ci-xr-height
            apps/capture/output/ci-face/face-report.json
            output/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-xr-timings-${{ matrix.shard }}-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Viewer and Knowledge browser checks
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          playwright: "true"
      - name: Knowledge Atlas browser checks
        run: pnpm timed knowledge -- pnpm run test:knowledge
      - name: Viewer AR checks
        if: ${{ !cancelled() }}
        run: pnpm timed xr-viewer -- pnpm run test:xr:viewer
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            apps/viewer-web/test-results
            apps/viewer-web/playwright-report
            apps/knowledge/test-results
            apps/knowledge/playwright-report
            output/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  pipeline:
    name: Capture to viewer pipeline (shard ${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    # Shard 1 takes about 9 minutes on a good runner (setup, the app builds and
    # ~7.5 minutes of tests, since PRD-043 added the object take), so 10 left
    # no margin for a slow runner. A slow runner stalled it past 15 twice on
    # 2026-10-25, cancelled with no report. Playwright now stops itself at 16
    # minutes of tests (playwright.config.ts), inside this ceiling, so a slow
    # run fails with its diagnostics. The ceiling costs nothing when tests pass.
    timeout-minutes: 20
    # The pipeline specs dominate this job; Playwright's file sharding splits
    # them between two runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          playwright: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/viewer-api/tools/requirements.txt
      - name: Install Quick Look conversion dependencies
        run: |
          python3 -m pip install -r apps/viewer-api/tools/requirements.txt
          # Playwright's install-deps step already refreshed the apt index.
          command -v ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture to viewer pipeline
        run: pnpm timed pipeline-shard-${{ matrix.shard }} -- pnpm run test:smoke:pipeline --shard=${{ matrix.shard }}/2
      - name: Upload Quick Look fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicklook-fidelity-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            output/quicklook/**/capture-export.glb
            output/quicklook/**/capture-quicklook.usdz
            output/quicklook/**/quicklook-validation.json
            output/quicklook/**/exercise-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            apps/viewer-web/test-results
            apps/viewer-web/playwright-report
            output/test-results
            output/pointing-viewer/takes/*-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-timings-${{ matrix.shard }}-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  portal:
    name: Portal view end-to-end
    needs: [changes]
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          playwright: "true"
      - name: Portal gestures and real capture
        run: pnpm timed portal -- pnpm run test:portal
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-failure-${{ github.run_id }}
          path: |
            apps/viewer-web/test-results
            apps/viewer-web/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-timings-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI Gate
    # Not always(): a cancelled run (superseded by a newer push, or GitHub
    # occasionally creating two runs for one push) would still start a runner
    # here only to report failure. Failed or skipped jobs still reach the gate.
    if: ${{ !cancelled() }}
    needs: [changes, quality, capture-xr, e2e, pipeline, portal]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      CAPTURE_XR_RESULT: ${{ needs.capture-xr.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      PIPELINE_RESULT: ${{ needs.pipeline.result }}
      PORTAL_RESULT: ${{ needs.portal.result }}
    steps:
      - name: Summarize jobs
        run: |
          {
            echo "## CI gate"
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Quality, unit tests and build | ${QUALITY_RESULT} |"
            echo "| Capture XR checks (all shards) | ${CAPTURE_XR_RESULT} |"
            echo "| Viewer and Knowledge browser checks | ${E2E_RESULT} |"
            echo "| Capture to viewer pipeline (all shards) | ${PIPELINE_RESULT} |"
            echo "| Portal view end-to-end | ${PORTAL_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Enforce required jobs
        run: |
          # A job is either green or skipped because its area was not
          # touched by this push; anything else fails the gate.
          test "${CHANGES_RESULT}" = "success"
          ok() { test "$1" = "success" || test "$1" = "skipped"; }
          ok "${QUALITY_RESULT}"
          ok "${CAPTURE_XR_RESULT}"
          ok "${E2E_RESULT}"
          ok "${PIPELINE_RESULT}"
          ok "${PORTAL_RESULT}"
