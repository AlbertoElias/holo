name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-fast:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @holoim/api prisma:generate

      - name: Copy viewer-api env
        run: cp apps/viewer-api/.env.example apps/viewer-api/.env

      - name: Lint
        run: pnpm run lint:all

      - name: Typecheck
        run: pnpm run typecheck:all

  test:
    name: Test
    needs: verify-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @holoim/api prisma:generate

      - name: Copy viewer-api env
        run: cp apps/viewer-api/.env.example apps/viewer-api/.env

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run tests
        run: pnpm run test:all

  build:
    name: Build
    needs: verify-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @holoim/api prisma:generate

      - name: Copy viewer-api env
        run: cp apps/viewer-api/.env.example apps/viewer-api/.env

      - name: Build all
        run: pnpm run build:all

  smoke:
    name: Smoke Test
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @holoim/api prisma:generate

      - name: Copy viewer-api env
        run: cp apps/viewer-api/.env.example apps/viewer-api/.env

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run smoke pipeline
        run: pnpm run test:smoke:pipeline
