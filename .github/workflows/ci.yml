name: CI

# One tier for every event. Browser checks advance simulated time explicitly,
# so they are deterministic and cheap enough to run on every push; the weekly
# schedule only catches runner-image and dependency drift on unchanged code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  PNPM_VERSION: 10.29.3

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/viewer-api/.env.example apps/viewer-api/.env
      - run: pnpm --filter @holoim/api prisma:generate
      - name: Lint and typecheck
        run: pnpm timed quality-checks -- pnpm run check:all
      - name: Unit tests
        run: pnpm timed unit-tests -- pnpm run test:unit:all
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-timings-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/viewer-api/.env.example apps/viewer-api/.env
      - run: pnpm --filter @holoim/api prisma:generate
      - name: Install KTX-Software
        env:
          KTX_VERSION: 4.4.2
        run: |
          curl -fsSL -o /tmp/ktx.tar.bz2 "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}/KTX-Software-${KTX_VERSION}-Linux-x86_64.tar.bz2"
          tar -xjf /tmp/ktx.tar.bz2 -C "${RUNNER_TEMP}"
          KTX_ROOT="$(find "${RUNNER_TEMP}" -maxdepth 1 -type d -name 'KTX-Software-*' | head -n 1)"
          test -n "${KTX_ROOT}"
          echo "${KTX_ROOT}/bin" >> "${GITHUB_PATH}"
          "${KTX_ROOT}/bin/ktx" --version
      - name: Build
        run: pnpm timed build -- pnpm run build:all
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/viewer-api/.env.example apps/viewer-api/.env
      - run: pnpm --filter @holoim/api prisma:generate
      - run: pnpm --filter @holoim/capture exec playwright install --with-deps chromium
      - name: Capture XR checks
        run: pnpm timed xr-capture -- pnpm run test:xr:capture
      - name: Viewer AR checks
        run: pnpm timed xr-viewer -- pnpm run test:xr:viewer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Quick Look conversion dependencies
        run: |
          python3 -m pip install -r apps/viewer-api/tools/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Capture to viewer pipeline
        run: pnpm timed pipeline -- pnpm run test:smoke:pipeline
      - name: Upload Quick Look fidelity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicklook-fidelity-${{ github.run_id }}
          path: |
            output/quicklook/**/capture-export.glb
            output/quicklook/**/capture-quicklook.usdz
            output/quicklook/**/quicklook-validation.json
            output/quicklook/**/exercise-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            apps/capture/output/ci-mock-vr
            apps/capture/output/ci-vr-locomotion
            apps/capture/output/ci-hand-replay
            apps/viewer-web/test-results
            apps/viewer-web/playwright-report
            output/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload timing summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ github.run_id }}
          path: output/test-results
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs: [quality, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Summarize jobs
        run: |
          {
            echo "## CI gate"
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Quality | ${QUALITY_RESULT} |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Browser end-to-end | ${E2E_RESULT} |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Enforce required jobs
        run: |
          test "${QUALITY_RESULT}" = "success"
          test "${BUILD_RESULT}" = "success"
          test "${E2E_RESULT}" = "success"
