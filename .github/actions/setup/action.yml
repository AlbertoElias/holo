name: Set up workspace
description: >-
  pnpm, Node 24, frozen install, the viewer API .env and Prisma client, and
  optionally a cached Playwright Chromium. Run after actions/checkout.

inputs:
  pnpm-version:
    description: pnpm version to install
    required: true
  playwright:
    description: Install Playwright Chromium ("true" or "false")
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: cp apps/viewer-api/.env.example apps/viewer-api/.env
    - shell: bash
      run: pnpm --filter @holoim/api prisma:generate
    - name: Cache Playwright browsers
      id: playwright-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    # A cache hit restores the browser binaries; the system libraries they
    # need come from apt only where the runner image lacks them.
    - name: Install Playwright Chromium
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      # A slow apt mirror falls back to archive.ubuntu.com rather than eating the job's timeout (B-024).
      run: scripts/ci-apt.sh 240 pnpm --filter @holoim/capture exec playwright install --with-deps chromium
    - name: Cache Playwright system packages
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/playwright-debs
        key: playwright-debs-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Playwright system dependencies
      if: inputs.playwright == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      # Only the packages the runner image lacks, from cached .deb files
      # when warm, so no apt mirror is on the path (B-024).
      run: DEB_CACHE="${HOME}/.cache/playwright-debs" scripts/ci-playwright-deps.sh
