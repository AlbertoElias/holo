<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebXR GLTF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1012;
        color: #eceff4;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        font-size: 13px;
      }

      #recording-ui {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #recording-ui button {
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #eceff4;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      #recording-ui button:hover {
        background: rgba(32, 36, 42, 0.9);
        border-color: rgba(255, 255, 255, 0.5);
      }

      #recording-ui button:active {
        background: rgba(48, 54, 62, 0.9);
      }

      #recording-ui button.recording {
        background: rgba(180, 50, 50, 0.5);
        border-color: rgba(255, 100, 100, 0.6);
      }

      #recording-ui button.recording:hover {
        background: rgba(200, 60, 60, 0.6);
      }

      #recording-ui .shortcut-hint {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Loading scene...</div>
    <div id="recording-ui" style="display: none;">
      <button id="record-btn" type="button">Start Recording</button>
      <span class="shortcut-hint">R</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
