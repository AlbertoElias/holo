packages:
  - apps/*
  - packages/*

catalog:
  # Core tooling — pinned once, used everywhere via "catalog:" protocol
  typescript: ^5.7.3
  eslint: ^9.39.2
  vitest: ^3.2.4
  vite: ^7.3.1

  # Shared runtime deps
  three: ^0.173.0
  zod: ^3.24.2

  # Shared type packages
  "@types/three": ^0.173.0

  # Shared test utilities
  webxr-polyfill: ^2.0.3

  # ESLint ecosystem (used by config-eslint + capture)
  typescript-eslint: ^8.26.1
  "@eslint/js": ^9.22.0
  globals: ^16.0.0
