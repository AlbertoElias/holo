packages:
  - apps/*
  - packages/*

catalog:
  # Core tooling — pinned once, used everywhere via "catalog:" protocol
  typescript: ^7.0.2
  eslint: ^9.39.2
  vitest: ^3.2.4
  vite: ^7.3.1

  # Shared runtime deps
  three: npm:super-three@0.181.0
  zod: ^4.4.3

  # Shared type packages
  "@types/three": ^0.173.0

  # Shared test utilities
  webxr-polyfill: ^2.0.3

  # ESLint ecosystem (used by config-eslint + capture)
  typescript-eslint: ^8.71.2
  "@eslint/js": ^9.22.0
  globals: ^16.0.0
