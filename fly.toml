# HoloIM viewer API — single-machine beta.
# Deploy from the workspace root:  fly deploy -c fly.toml
# One machine only: SQLite lives on its volume (media is on R2). Do not
# scale this app horizontally until Postgres replaces SQLite
# (see docs/DEPLOYMENT.md).
app = "holoim-api"
primary_region = "iad"

[build]
  dockerfile = "apps/viewer-api/Dockerfile"

[env]
  PORT = "3001"
  # Media on R2 behind media.holostud.io; S3_* and PUBLIC_MEDIA_BASE_URL
  # are Fly secrets (docs/DEPLOYMENT.md section 3).
  STORAGE_DRIVER = "s3"
  USDZ_WORKER_ENABLED = "true"

[http_service]
  internal_port = 3001
  force_https = true
  # Sandbox/demo app: stop when idle, start on the next request (a few
  # seconds cold start). Still one machine; this only scales it to zero.
  # USDZ conversions interrupted by a stop are reclaimed after
  # USDZ_STALE_CLAIM_MS once the machine is running again.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    type = "http"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[mounts]]
  source = "holoim_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
