# HoloIM viewer API — single-machine beta.
# Deploy from the workspace root:  fly deploy -c fly.toml
# One machine only: SQLite and local uploads live on its volume. Do not
# scale this app horizontally until Postgres replaces SQLite
# (see docs/DEPLOYMENT.md).
app = "holoim-api"
primary_region = "iad"

[build]
  dockerfile = "apps/viewer-api/Dockerfile"

[env]
  PORT = "3001"
  STORAGE_DRIVER = "local"
  USDZ_WORKER_ENABLED = "true"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    type = "http"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[mounts]]
  source = "holoim_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
